<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found · El Dorado Forward</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/images/logo-full-color.png" type="image/png">
<link rel="stylesheet" href="/tokens/base.css">
<link rel="stylesheet" href="/tokens/colors.css">
<link rel="stylesheet" href="/tokens/fonts.css">
<link rel="stylesheet" href="/tokens/spacing.css">
<link rel="stylesheet" href="/tokens/effects.css">
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/styles.css">
<style>
  .edf-404 {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: var(--space-8, 48px) var(--space-5, 24px);
  }
  .edf-404__code {
    font-size: 14px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--text-muted, #6b7280);
    margin-bottom: var(--space-4, 16px);
  }
  .edf-404__title {
    font-size: 32px;
    margin: 0 0 var(--space-4, 16px);
  }
  .edf-404__body {
    max-width: 480px;
    margin: 0 0 var(--space-6, 32px);
    color: var(--text-muted, #4b5563);
  }
  .edf-404__link {
    display: inline-block;
    padding: 12px 24px;
    border-radius: var(--radius-lg, 8px);
    background: var(--edf-navy, #0f1f3d);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>
<main>
  <div class="edf-404">
    <div class="edf-404__code">404</div>
    <h1 class="edf-404__title">Page not found</h1>
    <p class="edf-404__body">The page or document you're looking for doesn't exist or may have moved. If you followed a link from this site, please let us know so we can fix it.</p>
    <a class="edf-404__link" href="/">Back to homepage</a>
  </div>
</main>
</body>
</html>
