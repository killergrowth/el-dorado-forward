          </div>
          <ul style={{ margin: 0, padding: 0, listStyle: 'none', display: 'flex', flexDirection: 'column', gap: 10 }}>
            {points.map((p, i) => (

    ['What did residents get?', '$400 water bill credits and $400 gift cards', 'A lawsuit, an ousted council and recall petitions'],
    ['What happened next?', '19 more data centers in the pipeline', 'No plans or permits submitted as of June 2026'],

        </div>
