<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Dorado Forward</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      background: #ffffff;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-wrap img {
      width: 50%;
      max-width: 600px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img src="/images/logo.jpg" alt="El Dorado Forward">
  </div>
</body>
</html>
