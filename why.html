<!-- PAGE: Why -->
<!DOCTYPE html>
<html lang="en">
<head>
<title>Why This Matters for El Dorado · El Dorado Forward</title>
<meta name="description" content="High property taxes, bad roads, declining population. Without economic development, none of it improves. Here's why the November 3 vote matters for El Dorado.">
<!-- CANONICAL: https://eldoradoforward.com/why/ -->
<!-- OG_TITLE: Why This Matters for El Dorado · El Dorado Forward -->
<!-- INJECT:HEAD -->
</head>
<body>
<!-- INJECT:HEADER -->
<main>
<div id="page-root"></div>
</main>
<!-- INJECT:FOOTER -->
<script type="text/babel">
(function() {
  const DS = window.ElDoradoForwardDesignSystem_eb1381;
  const { Card, Stat, Badge, Icon } = DS;

  const Step = ({ n, icon, title, children }) => (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14, padding: '28px 28px 32px', background: '#fff', borderRadius: 'var(--radius-lg)', border: '1px solid var(--border-1)' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <span style={{ font: '900 56px/1 var(--font-display)', color: 'var(--edf-green)' }}>{n}</span>
        <span style={{ width: 48, height: 48, borderRadius: 'var(--radius-md)', background: 'var(--edf-blue-100)', color: 'var(--edf-blue)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><Icon name={icon} size={24} /></span>
      </div>
      <h3 style={{ font: '900 26px/1.1 var(--font-display)', textTransform: 'uppercase', color: 'var(--fg-1)', margin: 0 }}>{title}</h3>
      <p style={{ font: '400 17px/1.5 var(--font-body)', color: 'var(--fg-2)' }}>{children}</p>
    </div>
  );

  const Band = ({ eyebrow, title, children, photo, src, pos, flip, bg }) => (
    <Section bg={bg} pad="var(--space-8)">
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(min(420px,100%),1fr))', gap: 48, alignItems: 'center' }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 18, order: flip ? 2 : 1 }}>
          <Eyebrow>{eyebrow}</Eyebrow>
          <H2 style={{ fontSize: 40 }}>{title}</H2>
          {children}
        </div>
        <div style={{ order: flip ? 1 : 2 }}><PhotoSlot label={photo} src={src} pos={pos} height={440} /></div>
      </div>
    </Section>
  );

  const cell = { padding: '12px 10px', borderTop: '1px solid var(--border-1)', font: '500 16px/1.3 var(--font-body)' };
  const num = { ...cell, textAlign: 'right', fontVariantNumeric: 'tabular-nums' };
  const tot = { ...num, borderTop: '2px solid var(--edf-blue)', font: '900 20px/1 var(--font-display)', color: 'var(--edf-blue)' };
  const big = { font: '900 clamp(64px,8vw,104px)/0.9 var(--font-display)', color: 'var(--edf-blue)', letterSpacing: 'var(--tracking-display)' };
  const taxRows = [['City of El Dorado', '58.710', '36.85', '$251', '$629'], ['USD 490 (local portion)*', '42.456', '31.83', '$122', '$306'], ['Butler County', '29.625', '27.79', '$21', '$53'], ['Butler Community College', '13.239', '12.42', '$9', '$24']];

  function Why() {
    return <>
      <PageHead n="2" eyebrow="Why is this an El Dorado issue?" depth="4 min read" title="Why this matters here" lead="The ballot question is local. So are the reasons it matters: our challenges, our water, and our reputation with the next company deciding where to invest." />

      <Section pad="var(--space-8)" bg="var(--bg-subtle)">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 28 }}>
          <Eyebrow>The 30-second version</Eyebrow>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(min(250px,100%),1fr))', gap: 20 }}>
            <Step n="1" icon="trending-down" title="We have real challenges">High property taxes. Bad roads. A shrinking population. Fixing them takes <strong>more growth, not less</strong>.</Step>
            <Step n="2" icon="droplets" title="We built water for industry">El Dorado Lake has <strong>10 million gallons a day</strong> set aside for business. We still owe <strong>$39.8 million</strong> on it, and industrial customers help pay it off.</Step>
            <Step n="3" icon="receipt" title="Growth can cut your tax bill">A $1 billion data center could save about <strong>$1,010 a year</strong> on a $250,000 home. That's <strong>$404 for every $100,000</strong> of home value.</Step>
            <Step n="4" icon="landmark" title="No tax break required">In Barber County, Google agreed to pay <strong>100% of its property taxes</strong>, plus $5.5 million in community benefit payments. Kansas's data center law is <strong>a sales tax break, not a property tax break</strong>.</Step>
          </div>
        </div>
      </Section>

      <Band eyebrow="Real challenges" title="Can El Dorado afford to close the door?" photo="ELDO letter sculpture in front of the Ad Astra Per Aspera mural" src="eldo-sculpture.png" pos="center 60%">
        <p style={{ font: '700 18px/1.5 var(--font-body)' }}>High property taxes. Bad roads. Poverty above the Kansas average. Declining population. Infrastructure upgrades. And more…</p>
        <Badge tone="dark" style={{ alignSelf: 'flex-start', height: 34, fontSize: 13, letterSpacing: '.02em', textTransform: 'none' }}>El Dorado has real challenges.</Badge>
        <P>Solving them requires <strong>more</strong> growth, investment and economic opportunity — <strong>not less</strong>.</P>
      </Band>

      <Section bg="var(--bg-subtle)" pad="var(--space-7)">
        <Grid min={260} gap={16}>
          <Card><Stat value="−1.2%" label="Population change, 13,021 (2010) to 12,870 (2020)" /><Src ids={['census']} /></Card>
          <Card><Stat value="Above" tone="green" label="El Dorado's poverty rate compared with the Kansas rate" /><Src ids={['census']} /></Card>
          <Card><Stat value="58.71" label="2026 city mill levy, above the revenue-neutral rate of 55.669" /><Src ids={['budget2026']} /></Card>
        </Grid>
      </Section>

      <Section id="taxes" pad="var(--space-8)">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 40 }}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(min(420px,100%),1fr))', gap: 48, alignItems: 'start' }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
              <Eyebrow>Property taxes</Eyebrow>
              <H2 style={{ fontSize: 40 }}>What a $1 billion data center could mean for your tax bill</H2>
              <Badge tone="dark" style={{ alignSelf: 'flex-start', height: 30, fontSize: 12, letterSpacing: '.02em', textTransform: 'none' }}>Illustrative example</Badge>
              <P>When a large new property joins the tax base, the cost of local government is spread across more value. If the City, county, school district and college each collect the same total dollars as before (called revenue-neutral), their mill levies fall, and <strong>existing homeowners pay less</strong>.</P>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6, padding: '8px 0' }}>
                <span style={big}>$1,010</span>
                <span style={{ font: '700 20px/1.4 var(--font-body)' }}>a year saved on a $250,000 home</span>
                <span style={{ font: '500 17px/1.45 var(--font-body)', color: 'var(--fg-2)' }}>That's close to the average Kansas home value of $250,918, and about 22% of the modeled bill.</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '16px 20px', background: 'var(--bg-subtle)', borderRadius: 'var(--radius-lg)' }}>
                <span style={{ font: '900 36px/1 var(--font-display)', color: 'var(--edf-blue)' }}>$404</span>
                <span style={{ font: '600 17px/1.4 var(--font-body)' }}>saved for every $100,000 of your home's value. Multiply to estimate your own.</span>
              </div>
              <Src ids={['zillowKs']} />
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              <span style={{ font: 'var(--type-eyebrow)', letterSpacing: 'var(--tracking-eyebrow)', textTransform: 'uppercase', color: 'var(--edf-blue)' }}>Modeled savings by taxing entity, 2026 levies</span>
              <div style={{ overflowX: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 520 }}>
                  <thead><tr>{['Taxing entity', 'Mills today', 'Revenue-neutral', 'Per $100K', '$250K home'].map((h, i) => <th key={h} style={{ ...cell, borderTop: 0, font: '700 13px/1.3 var(--font-body)', color: 'var(--fg-2)', textAlign: i ? 'right' : 'left' }}>{h}</th>)}</tr></thead>
                  <tbody>
                    {taxRows.map(r => <tr key={r[0]}><td style={cell}>{r[0]}</td><td style={num}>{r[1]}</td><td style={num}>{r[2]}</td><td style={num}>{r[3]}</td><td style={{ ...num, fontWeight: 700 }}>{r[4]}</td></tr>)}
                    <tr><td style={{ ...cell, fontWeight: 700, borderTop: '2px solid var(--edf-blue)' }}>Total</td><td style={{ ...num, borderTop: '2px solid var(--edf-blue)' }}></td><td style={{ ...num, borderTop: '2px solid var(--edf-blue)' }}></td><td style={tot}>$404</td><td style={tot}>$1,010</td></tr>
                  </tbody>
                </table>
              </div>
              <P style={{ fontSize: 15 }}>The statewide school levy is set by Kansas law, so it is not reduced in this example. *The USD 490 local rate is from the original analysis and still needs confirming against the district's 2025–26 budget.</P>
              <Src ids={['city2026', 'cityNotice2026', 'county2026', 'bcc2026']} />
            </div>
          </div>
          <Grid min={320} gap={20}>
            <Card eyebrow="How the example works" title="The assumptions">
              <ul style={{ margin: 0, paddingLeft: 18, display: 'flex', flexDirection: 'column', gap: 6 }}>
                <li>A $1 billion data center inside El Dorado city limits and USD 490</li>
                <li>$300 million of it is taxable real property (land, buildings, site improvements)</li>
                <li>Assessed at the 25% commercial rate: $75 million of new assessed value</li>
                <li>Homes assessed at the 11.5% residential rate</li>
                <li>Each taxing entity holds its total property-tax revenue flat</li>
              </ul>
              <Src ids={['kdorRatio', 'kdorExempt', 'ksa79201x']} />
            </Card>
            <Card eyebrow="What could change it" title="Why $1 billion isn't $1 billion of tax base">
              Kansas exempts business machinery and equipment bought after June 30, 2006, from property tax, and that includes computers. <strong>This rule applies to every business in Kansas</strong>, not just data centers. Because most of a data center's cost is equipment, this example counts only $300 million as taxable. That figure is an assumption, not a known project, so the real result could be higher or lower.
              <Src ids={['kdorAbate', 'ksa79223', 'ksCommerceExempt']} />
            </Card>
          </Grid>
        </div>
      </Section>

      <Section bg="var(--bg-subtle)" pad="var(--space-8)">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 28 }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <Eyebrow>Common misconceptions</Eyebrow>
            <H2 style={{ fontSize: 36 }}>What people get wrong about data center taxes</H2>
          </div>
          <Grid min={320} gap={20}>
            <Card eyebrow="Kansas SB 98" title="It's a sales tax break, not a property tax break">
              In 2025 Kansas passed Senate Bill 98. It lets qualifying data centers skip sales tax on what they buy to build and equip the facility, for up to 20 years, if they invest at least $250 million and create jobs. It <strong>does not touch property tax</strong>. The data center <strong>still pays property tax on its land and buildings</strong> every year, like any other business. The same law also <strong>bars utilities from giving data centers discounted electric rates</strong>.
              <Src ids={['sb98Summary', 'sb98Commerce', 'ksStatute']} />
            </Card>
            <Card eyebrow="Barber County, Kansas" title="Google agreed to pay 100% of its property taxes">
              In August 2026, Barber County approved Google's first Kansas data center, a 1.7 million square foot, air-cooled facility near Sharon. Under the agreement, Google pays <strong>100% of its property taxes with no abatement</strong>, plus $5.5 million in community benefit payments. County leaders estimate <strong>more than $320 million in taxes over 20 years</strong>, in a county with an $11 million annual budget.
              <Src ids={['kakeBarber', 'kwchBarber']} />
            </Card>
            <Card eyebrow="Abatements" title="A tax break isn't automatic">
              <strong>A property tax abatement is a choice local officials make in public</strong>, not something a data center gets by default. Under El Dorado's rules, any incentive would be a separate decision from the Special Use Permit. Barber County shows <strong>a large data center can come to Kansas paying its full share</strong>.
              <Src ids={['pcApr', 'kakeBarber']} />
            </Card>
          </Grid>
        </div>
      </Section>

      <Band eyebrow="El Dorado Lake" title="El Dorado invested in its future forty years ago" photo="El Dorado Lake shoreline at sunset" src="el-dorado-lake.jpg" pos="center 55%" flip>
        <P>More than four decades ago, our community helped build something bigger than what El Dorado needed at the time. El Dorado Lake created the water capacity our community would need for generations — including capacity <strong>specifically intended to support future growth and industry.</strong></P>
        <P>Today, El Dorado Lake still has <strong>10 million gallons per day</strong> of drought-tolerant water capacity dedicated to industrial use. For years, our community has promoted that water as <strong>one of our greatest advantages in attracting new investment.</strong></P>
        <p style={{ font: '700 18px/1.5 var(--font-body)', color: 'var(--edf-blue)' }}>But having abundant industrial water isn't a problem to fear. It's an asset that generations of El Dorado residents invested in creating.</p>
      </Band>

      <WaterAdvantage />

      <Section bg="var(--bg-subtle)" pad="var(--space-7)">
        <Grid min={260} gap={16}>
          <Card><Stat value="10 MGD" label="Million gallons per day of firm-yield water the City can provide to business customers" /><Src ids={['industrialWater']} /></Card>
          <Card><Stat value="1981" tone="green" label="El Dorado Lake completed. The City owns its water storage space, unique among Corps reservoirs in Kansas." /><Src ids={['lake']} /></Card>
          <Card><Stat value="$39.8M" label="City obligation to the U.S. Army Corps of Engineers, separate from municipal debt" /><Src ids={['cityDebt']} /></Card>
        </Grid>
      </Section>

      <Band eyebrow="The next company is watching" title="El Dorado's next opportunity is on deck" photo="Aerial of El Dorado ball fields at dusk" src="ballfields-aerial.jpg" pos="center 65%">
        <P>When businesses decide where to invest, they look at more than land, highways and utilities. They look at certainty. Responsiveness. Permitting. <strong>Community support.</strong></P>
        <p style={{ font: '700 18px/1.5 var(--font-body)', color: 'var(--edf-blue)' }}>Because when investment doesn't come, our needs don't disappear.</p>
      </Band>

      <Section bg="var(--bg-subtle)" pad="var(--space-8)">
        <Grid min={340} gap={24}>
          <Card eyebrow="Our industrial history" title="El Dorado has never built its future by standing still">
            <PhotoSlot src="stapleton-no1-1915.jpg" label="Stapleton No. 1 well crew, El Dorado oil field" chevron={false} height={220} pos="center 40%" style={{ margin: '-8px -8px 4px', filter: 'grayscale(1)' }} />
            In October 1915, the Stapleton No. 1 well opened the El Dorado oil field. By 1918, the field was producing <strong>up to 9% of the nation's oil</strong>.
            <Src ids={['history', 'aoghs']} />
          </Card>
          <Card icon="landmark" eyebrow="The City's own work" title="Rules before a project, not after">
            In May 2026 the City said its zoning did not define or regulate data centers, so one could be interpreted as allowed "by right" in some industrial districts. It then <strong>adopted standards and a Special Use Permit requirement</strong>.
            <Src ids={['zoningStmt', 'statements']} more="/regulate/" />
          </Card>
        </Grid>
      </Section>

      <Section pad="var(--space-8)">
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(min(420px,100%),1fr))', gap: 48, alignItems: 'center' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
            <Eyebrow>Construction</Eyebrow>
            <H2 style={{ fontSize: 40 }}>Years of work before it ever opens</H2>
            <P>A large data center takes <strong>18 to 36 months</strong> to build, and big campuses are often built in phases over several years. At peak, <strong>800 to 1,500 workers</strong> can be on site. Those workers <strong>rent rooms, eat in our restaurants, fill up at our gas stations, and shop in our stores</strong> the whole time.</P>
            <Src ids={['cbreBuild', 'axiosBuild', 'kwchBarber']} />
          </div>
          <Grid min={220} gap={16}>
            <Card><Stat value="18–36" label="Months to build a large data center campus" /></Card>
            <Card><Stat value="1,500" tone="green" label="Workers on site at peak construction for a single large building" /></Card>
          </Grid>
        </div>
      </Section>

      <NextPage to="regulate" label="3 · Prohibition vs. regulation" title="What are the options?" />
    </>;
  }

  ReactDOM.createRoot(document.getElementById('page-root')).render(<Why />);
})();
</script>
</body>
</html>
